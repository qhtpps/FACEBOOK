<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Registro</title>

  <!-- Vista previa para WhatsApp, Facebook, Telegram, etc. -->
  <meta property="og:title" content="Registro">
  <meta property="og:description" content="Accede al formulario de registro.">
  <meta property="og:image" content="https://TU-USUARIO.github.io/TU-REPOSITORIO/facebook.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://TU-USUARIO.github.io/TU-REPOSITORIO/">

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Registro">
  <meta name="twitter:description" content="Accede al formulario de registro.">
  <meta name="twitter:image" content="https://TU-USUARIO.github.io/TU-REPOSITORIO/facebook.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .mensaje {
      font-size: 15px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <div class="mensaje">
      Cargando...
    </div>
  </div>

  <script>
    const destino =
      "https://script.google.com/macros/s/AKfycbwb3DjQVkGaum1KtojY4W-20OacI_JQ_gB5N49RrogK5qRjbxtPQJvyy7yGRuQFsZ5F/exec";

    /*
     * Esperamos un momento para que los rastreadores de WhatsApp,
     * Facebook, etc. puedan leer las etiquetas Open Graph.
     *
     * Después enviamos al usuario al Google Apps Script.
     */
    setTimeout(function () {
      window.location.href = destino;
    }, 800);
  </script>

</body>
</html>
